name: Download File

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک مستقیم فایل'
        required: true
        default: 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        run: |
          mkdir -p downloads
          curl -L --retry 3 --retry-delay 5 \
            -o "downloads/$(basename "${{ github.event.inputs.url }}")" \
            "${{ github.event.inputs.url }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: downloads/
